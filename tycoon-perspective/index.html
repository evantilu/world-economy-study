<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大佬視角報告</title>
<meta name="description" content="從經過驗證的投資者怎麼動錢，推論他們眼中的世界">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{
  --bg:#ffffff;--fg:#1f2328;--muted:#5f6670;--line:#e3e6ea;--soft:#f5f7f9;--accent:#1f5fbf;
  --fact:#1d7a46;--fact-bg:#e6f4ec;--inf:#8a4b00;--inf-bg:#fff1dc;--rep:#5b4bb3;--rep-bg:#eeebfb;--quo:#6a6f76;--quo-bg:#eef0f2;
  --w:760px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d;--fg:#e6e8eb;--muted:#9aa1ab;--line:#2c3038;--soft:#1e2127;--accent:#7fb0ff;
  --fact:#7fd6a4;--fact-bg:#173226;--inf:#ffc27a;--inf-bg:#3a2a12;--rep:#b9adff;--rep-bg:#28233f;--quo:#b5bac1;--quo-bg:#2a2e35;}}
:root[data-theme="dark"]{
  --bg:#16181d;--fg:#e6e8eb;--muted:#9aa1ab;--line:#2c3038;--soft:#1e2127;--accent:#7fb0ff;
  --fact:#7fd6a4;--fact-bg:#173226;--inf:#ffc27a;--inf-bg:#3a2a12;--rep:#b9adff;--rep-bg:#28233f;--quo:#b5bac1;--quo-bg:#2a2e35;}
*{box-sizing:border-box}
html{scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.75 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:30}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--w);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2}
main{max-width:var(--w);margin:0 auto;padding:8px 16px 96px}
h1{font-size:1.6em;line-height:1.35;margin:.8em 0 .4em}
h2{font-size:1.3em;line-height:1.4;margin:2em 0 .6em;padding-bottom:.3em;border-bottom:2px solid var(--line)}
h3{font-size:1.1em;line-height:1.45;margin:1.6em 0 .5em}
p,li{overflow-wrap:anywhere}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--line);color:var(--muted);background:var(--soft);border-radius:0 8px 8px 0}
code{background:var(--soft);padding:.1em .35em;border-radius:4px;font-size:.88em}
img{max-width:100%;height:auto;display:block;margin:1em auto;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1em 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;min-width:520px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:.78em;line-height:1.5;padding:0 .45em;border-radius:5px;margin:0 .15em;font-weight:600;white-space:nowrap}
.tag.fact{color:var(--fact);background:var(--fact-bg)}
.tag.inf{color:var(--inf);background:var(--inf-bg)}
.tag.rep{color:var(--rep);background:var(--rep-bg)}
.tag.quo{color:var(--quo);background:var(--quo-bg)}
details.person{border:1px solid var(--line);border-radius:10px;margin:.8em 0;background:var(--bg)}
details.person>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
details.person>summary::-webkit-details-marker{display:none}
details.person>summary::before{content:"▸";color:var(--muted);transition:transform .15s;flex:none}
details.person[open]>summary::before{transform:rotate(90deg)}
details.person>.body{padding:0 14px 8px;border-top:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:.6em 0 1em;font-size:13px;color:var(--muted);align-items:center}
.filters label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--soft)}
body.hide-inf .tag.inf{outline:2px dashed var(--inf)}
body.focus-inf p:not(:has(.tag.inf)), body.focus-inf li:not(:has(.tag.inf)){opacity:.35}
#toc{position:fixed;inset:0;z-index:40;display:none}
#toc.open{display:block}
#toc .shade{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#toc nav{position:absolute;top:0;right:0;bottom:0;width:min(86vw,360px);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
#toc nav .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
#toc a{display:block;color:var(--fg);text-decoration:none;padding:7px 8px;border-radius:6px;font-size:14.5px;line-height:1.4}
#toc a.l3{padding-left:22px;font-size:13.5px;color:var(--muted)}
#toc a.active{background:var(--soft);color:var(--accent)}
#toc input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--fg);font-size:15px;margin-bottom:8px}
mark{background:#ffe58a;color:#000;border-radius:3px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#lb.open{display:block}
#lb img{max-width:none;width:min(1400px,180vw);margin:24px auto;border:0;cursor:zoom-out}
#lb .x{position:fixed;top:12px;right:12px;z-index:51}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:none}
.meta{color:var(--muted);font-size:13px}
@media (min-width:900px){body{font-size:17px}}
@media print{header,#top,#progress,.filters{display:none}details.person{border:0}details.person>.body{display:block}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div id="progress"></div>
<header><div class="bar">
  <span class="t" id="barTitle">大佬視角報告</span>
  <a class="btn" href="report.pdf" title="下載 PDF">PDF</a>
  <button class="btn" id="themeBtn" title="切換深淺色">深淺</button>
  <button class="btn" id="tocBtn">目錄</button>
</div></header>
<main id="content"><p class="meta">載入中…</p></main>
<div id="toc"><div class="shade"></div><nav>
  <div class="head"><span>目錄</span><button class="btn" id="tocClose">關閉</button></div>
  <input id="q" type="search" placeholder="搜尋全文（例：台積電、日本）">
  <div id="tocList"></div>
</nav></div>
<div id="lb"><button class="btn x">關閉</button><img alt=""></div>
<button class="btn" id="top">↑ 頂端</button>
<script>
(async function(){
  const main=document.getElementById('content');
  let md;
  try{ md=await (await fetch('report.md',{cache:'no-cache'})).text(); }
  catch(e){ main.innerHTML='<p>讀取 report.md 失敗。</p>'; return; }
  main.innerHTML=marked.parse(md,{gfm:true});

  // tags 〔事實〕〔推論〕〔轉述〕〔報導〕
  const map={'事實':'fact','推論':'inf','轉述':'rep','報導':'quo'};
  const walker=document.createTreeWalker(main,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode()){if(/〔[^〕]{1,12}〕/.test(walker.currentNode.nodeValue))nodes.push(walker.currentNode);}
  nodes.forEach(n=>{
    const span=document.createElement('span');
    span.innerHTML=n.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
      .replace(/〔([^〕]{1,12})〕/g,(m,k)=>{const key=Object.keys(map).find(x=>k.startsWith(x));return key?`<span class="tag ${map[key]}">${k}</span>`:m;});
    n.replaceWith(...span.childNodes);
  });

  // tables scroll wrapper
  main.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t);});
  main.querySelectorAll('img').forEach(i=>{i.loading='lazy';});

  // ids for headings
  const slug=s=>s.trim().replace(/\s+/g,'-').replace(/[^\p{L}\p{N}\-]/gu,'').slice(0,60);
  const used={};
  main.querySelectorAll('h1,h2,h3').forEach(h=>{let id=slug(h.textContent)||'s';while(used[id])id+='-';used[id]=1;h.id=id;});
  const h1=main.querySelector('h1'); if(h1){document.title=h1.textContent;document.getElementById('barTitle').textContent=h1.textContent;}

  // collapse per-person sections (h3 under the h2 that starts with "5.")
  const h2s=[...main.querySelectorAll('h2')];
  const people=h2s.find(h=>/^5\./.test(h.textContent.trim()));
  if(people){
    const ctl=document.createElement('div');ctl.className='filters';
    ctl.innerHTML='<button class="btn" id="openAll">全部展開</button><button class="btn" id="closeAll">全部收合</button>';
    people.after(ctl);
    let el=ctl.nextElementSibling;
    while(el && el.tagName!=='H2'){
      if(el.tagName==='H3'){
        const d=document.createElement('details');d.className='person';d.id=el.id;el.removeAttribute('id');
        const s=document.createElement('summary');s.innerHTML='<span>'+el.innerHTML+'</span>';
        const b=document.createElement('div');b.className='body';
        d.append(s,b);el.replaceWith(d);
        let nx=d.nextElementSibling;
        while(nx && !/^H[23]$/.test(nx.tagName)){const n2=nx.nextElementSibling;b.appendChild(nx);nx=n2;}
        el=d.nextElementSibling;
      } else el=el.nextElementSibling;
    }
    document.getElementById('openAll').onclick=()=>main.querySelectorAll('details.person').forEach(d=>d.open=true);
    document.getElementById('closeAll').onclick=()=>main.querySelectorAll('details.person').forEach(d=>d.open=false);
  }

  // legend + inference filter after first hr/intro
  const lg=document.createElement('div');lg.className='filters';
  lg.innerHTML='<span class="tag fact">事實</span><span class="tag quo">報導</span><span class="tag rep">轉述</span><span class="tag inf">推論</span><label><input type="checkbox" id="focusInf"> 只看推論段落</label>';
  (main.querySelector('h1')||main.firstChild).after(lg);
  document.getElementById('focusInf').onchange=e=>document.body.classList.toggle('focus-inf',e.target.checked);

  // TOC
  const list=document.getElementById('tocList');
  const heads=[...main.querySelectorAll('h2,details.person')];
  heads.forEach(h=>{const a=document.createElement('a');const isP=h.tagName==='DETAILS';
    a.href='#'+h.id;a.textContent=isP?h.querySelector('summary').textContent:h.textContent;a.className=isP?'l3':'l2';
    a.onclick=()=>{if(isP)h.open=true;closeToc();};list.appendChild(a);
    if(!isP){let s=h.nextElementSibling;while(s&&s.tagName!=='H2'){if(s.tagName==='H3'){const b=document.createElement('a');b.href='#'+s.id;b.textContent=s.textContent;b.className='l3';b.onclick=closeToc;list.appendChild(b);}s=s.nextElementSibling;}}
  });
  const toc=document.getElementById('toc');
  function closeToc(){toc.classList.remove('open');}
  document.getElementById('tocBtn').onclick=()=>toc.classList.add('open');
  document.getElementById('tocClose').onclick=closeToc;toc.querySelector('.shade').onclick=closeToc;

  // search
  const q=document.getElementById('q');let marks=[];
  q.addEventListener('change',()=>{
    marks.forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));marks=[];main.normalize();
    const term=q.value.trim();if(!term)return;
    const w=document.createTreeWalker(main,NodeFilter.SHOW_TEXT);const hits=[];
    while(w.nextNode()){if(w.currentNode.nodeValue.includes(term))hits.push(w.currentNode);}
    hits.forEach(n=>{const parts=n.nodeValue.split(term);const frag=document.createDocumentFragment();
      parts.forEach((p,i)=>{frag.append(p);if(i<parts.length-1){const m=document.createElement('mark');m.textContent=term;frag.append(m);marks.push(m);}});n.replaceWith(frag);});
    if(marks.length){const d=marks[0].closest('details');if(d)d.open=true;closeToc();marks[0].scrollIntoView({block:'center'});}
    else alert('找不到：'+term);
  });

  // lightbox
  const lb=document.getElementById('lb'),lbi=lb.querySelector('img');
  main.addEventListener('click',e=>{if(e.target.tagName==='IMG'){lbi.src=e.target.src;lb.classList.add('open');}});
  lb.onclick=()=>lb.classList.remove('open');

  // progress, top, active toc
  const prog=document.getElementById('progress'),top=document.getElementById('top');
  top.onclick=()=>scrollTo({top:0,behavior:'smooth'});
  const links=[...list.querySelectorAll('a')];
  addEventListener('scroll',()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
    top.style.display=h.scrollTop>800?'block':'none';
    let cur=null;for(const x of heads){if(x.getBoundingClientRect().top<90)cur=x.id;}
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));},{passive:true});

  if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t){if(t.tagName==='DETAILS')t.open=true;t.scrollIntoView();}}
})();
// theme toggle
(function(){const r=document.documentElement,b=document.getElementById('themeBtn');
  let s=null;try{s=localStorage.getItem('theme')}catch(e){} if(s)r.dataset.theme=s;
  b.onclick=()=>{const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}};})();
</script>
</body>
</html>
