<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京房地產 case study</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<style>
:root{
  --bg:#fcfcfb;--fg:#1f2328;--muted:#5f6670;--faint:#898781;--line:#e3e6ea;--soft:#f3f4f2;--accent:#1f5fbf;
  --grid:#e1e0d9;--axis:#c3c2b7;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --fact:#1d7a46;--fact-bg:#e6f4ec;--inf:#8a4b00;--inf-bg:#fff1dc;--rep:#5b4bb3;--rep-bg:#eeebfb;--quo:#6a6f76;--quo-bg:#eef0f2;
  --key:#1f5fbf;--key-bg:#eaf2fd;--warn:#8a4b00;--warn-bg:#fff4e2;--field:#1d7a46;--field-bg:#e9f6ee;
  --hl:#ffe58a;--fb:#b9d4ff;
  --w:740px;--fs:16.5px;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  --bg:#16181d;--fg:#e6e8eb;--muted:#9aa1ab;--faint:#898781;--line:#2c3038;--soft:#1f2228;--accent:#7fb0ff;
  --grid:#2c2c2a;--axis:#383835;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --fact:#7fd6a4;--fact-bg:#173226;--inf:#ffc27a;--inf-bg:#3a2a12;--rep:#b9adff;--rep-bg:#28233f;--quo:#b5bac1;--quo-bg:#2a2e35;
  --key:#9cc3ff;--key-bg:#1b2a40;--warn:#ffc27a;--warn-bg:#33270f;--field:#8fe0b0;--field-bg:#15302a;
  --hl:#6b5a14;--fb:#25426e;}}
:root[data-theme="dark"]{
  --bg:#16181d;--fg:#e6e8eb;--muted:#9aa1ab;--faint:#898781;--line:#2c3038;--soft:#1f2228;--accent:#7fb0ff;
  --grid:#2c2c2a;--axis:#383835;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --fact:#7fd6a4;--fact-bg:#173226;--inf:#ffc27a;--inf-bg:#3a2a12;--rep:#b9adff;--rep-bg:#28233f;--quo:#b5bac1;--quo-bg:#2a2e35;
  --key:#9cc3ff;--key-bg:#1b2a40;--warn:#ffc27a;--warn-bg:#33270f;--field:#8fe0b0;--field-bg:#15302a;
  --hl:#6b5a14;--fb:#25426e;}
*{box-sizing:border-box}
html{scroll-padding-top:60px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.8 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:40}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--w);margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:8px;min-height:44px}
.bar .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{color:var(--muted);font-weight:400;margin-left:6px}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);line-height:1.3;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
main{max-width:var(--w);margin:0 auto;padding:4px 16px 140px}
h1{font-size:1.55em;line-height:1.35;margin:.9em 0 .3em}
h2{font-size:1.3em;line-height:1.4;margin:2.2em 0 .6em;padding-bottom:.35em;border-bottom:2px solid var(--line);display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
h3{font-size:1.08em;line-height:1.5;margin:1.8em 0 .5em;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
h2 .ht,h3 .ht{flex:1 1 60%}
p,li{overflow-wrap:anywhere}
li{margin:.2em 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote{margin:1em 0;padding:.5em 1em;border-left:3px solid var(--line);color:var(--muted);background:var(--soft);border-radius:0 8px 8px 0}
blockquote p{margin:.4em 0}
code{background:var(--soft);padding:.1em .35em;border-radius:4px;font-size:.88em}
img{max-width:100%;height:auto;display:block;margin:1em auto;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1em 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
.tw table{min-width:480px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
details{border:1px solid var(--line);border-radius:10px;margin:1em 0;padding:0 14px}
details>summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--accent)}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:.6em}
/* tags */
.tag{display:inline-block;font-size:.76em;line-height:1.55;padding:0 .45em;border-radius:5px;margin:0 .15em;font-weight:600;white-space:nowrap;vertical-align:.08em}
.tag.fact{color:var(--fact);background:var(--fact-bg)}.tag.inf{color:var(--inf);background:var(--inf-bg)}
.tag.rep{color:var(--rep);background:var(--rep-bg)}.tag.quo{color:var(--quo);background:var(--quo-bg)}
/* status badges */
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:.35em;border:1px solid transparent}
.st.todo{color:var(--muted);border-color:var(--line)}
.st.draft{color:var(--inf);background:var(--inf-bg)}
.st.done{color:var(--fact);background:var(--fact-bg)}
.st.wip{color:var(--rep);background:var(--rep-bg)}
.fbtn{font-size:12.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;margin-top:.3em;white-space:nowrap}
.fbtn.has{color:var(--accent);border-color:var(--accent)}
/* callouts */
.co{border:0;border-radius:10px;padding:.7em 1em;margin:1.1em 0;color:var(--fg)}
.co ol,.co ul{padding-left:1.25em;margin:.3em 0}
.co .cot{font-weight:700;font-size:.9em;margin-bottom:.2em;display:block}
.co.key{background:var(--key-bg)}.co.key .cot{color:var(--key)}
.co.warn{background:var(--warn-bg)}.co.warn .cot{color:var(--warn)}
.co.field{background:var(--field-bg)}.co.field .cot{color:var(--field)}
/* overview cards */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:1.2em 0}
.map a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--fg);background:var(--bg)}
.map a:active{background:var(--soft)}
.map .n{font-size:12px;color:var(--muted)}
.map .h{font-weight:600;line-height:1.45;margin:2px 0 6px}
.map .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.map .c{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin:.6em 0 1em}
/* charts */
figure.chart{margin:1.4em 0;border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;background:var(--bg)}
.ch-t{font-weight:600;font-size:15px;line-height:1.45}
.ch-s{color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.ch-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.ch-lg i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:5px}
.ch-lg i.box{height:10px;width:10px;border-radius:2px}
.ch-box{position:relative;touch-action:pan-y}
.ch-box svg{display:block;width:100%;overflow:visible}
.ch-box text{font-size:11px;fill:var(--faint);font-variant-numeric:tabular-nums}
.ch-box .evt text{fill:var(--muted)}
.ch-tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:5;min-width:110px}
.ch-tip .x{color:var(--muted);font-size:12px}
.ch-tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ch-tip .r i{width:12px;height:2px;border-radius:2px;flex:none}
.ch-tip .r b{font-variant-numeric:tabular-nums}
.ch-tip .r span{color:var(--muted)}
.ch-f{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
.ch-f .src{flex:1;overflow-wrap:anywhere}
.ch-f .acts{display:flex;gap:6px;flex:none}
.ch-f button{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.ch-tbl{display:none;margin-top:8px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ch-tbl table{font-size:12.5px;min-width:0}
.ch-err{color:var(--warn);font-size:13px}
/* marks */
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
mark.fbq{background:transparent;color:inherit;border-bottom:2px solid var(--accent);cursor:pointer}
mark.sq{background:#ffe58a;color:#000;border-radius:3px}
/* bottom nav */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#dock .in{max-width:var(--w);margin:0 auto;display:flex;justify-content:space-around;gap:4px}
#dock button{flex:1;border:0;background:transparent;padding:4px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:8px;min-height:44px;justify-content:center}
#dock button b{font-size:18px;line-height:1.1;font-weight:400}
#dock button:active{background:var(--soft)}
#dock .cnt{font-size:10px;color:var(--accent)}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:35;display:none;gap:6px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#selbar button{border:0;background:transparent;color:var(--bg);padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap}
#selbar button:active{background:rgba(255,255,255,.15)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-width:var(--w);margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.sheet .q{font-size:14px;color:var(--muted);background:var(--soft);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 8px 8px 0;margin:6px 0 10px;max-height:120px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);color:var(--fg);font:15px/1.6 inherit;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:8px 0}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#tocList a{display:flex;gap:8px;align-items:center;color:var(--fg);text-decoration:none;padding:8px;border-radius:8px;font-size:14.5px;line-height:1.4}
#tocList a.l3{padding-left:24px;font-size:13.5px;color:var(--muted)}
#tocList a.active{background:var(--soft);color:var(--accent)}
#tocList a .sp{flex:1}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--fg);font-size:15px;margin-bottom:8px}
.fbl{list-style:none;padding:0;margin:0}
.fbl li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px;line-height:1.55}
.fbl .m{color:var(--muted);font-size:12.5px}
.fbl .s{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px}
.fbl .s.o{color:var(--inf);background:var(--inf-bg)}.fbl .s.c{color:var(--fact);background:var(--fact-bg)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--soft);color:var(--accent);border-color:var(--accent)}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:none;overflow:auto}
#lb.open{display:block}
#lb img{max-width:none;width:min(1400px,180vw);margin:24px auto;border:0;cursor:zoom-out}
.meta{color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:70;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;display:none}
@media (min-width:900px){:root{--fs:17px}}
@media print{header,#dock,#progress,#selbar,.fbtn,.ch-f .acts{display:none}details{border:0}main{padding-bottom:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div id="progress"></div>
<header><div class="bar">
  <span class="t" id="barTitle">東京房地產 case study</span>
</div></header>
<main id="content"><p class="meta">載入中…</p></main>

<div id="selbar">
  <button id="selFb">💬 回饋</button>
  <button id="selHl">🖍 畫重點</button>
  <button id="selX">✕</button>
</div>

<nav id="dock"><div class="in">
  <button id="dToc"><b>☰</b>目錄</button>
  <button id="dFb"><b>💬</b><span>回饋<span class="cnt" id="fbCount"></span></span></button>
  <button id="dFont"><b>Aa</b>字級</button>
  <button id="dTheme"><b>◐</b>深淺</button>
  <button id="dTop"><b>↑</b>頂端</button>
</div></nav>

<div class="sheet" id="tocSheet"><div class="shade"></div><div class="pane">
  <div class="grab"></div>
  <div class="hd"><span>目錄</span><button class="btn ghost" data-close>關閉</button></div>
  <input id="q" type="search" placeholder="搜尋全文（例：容積、空屋、日銀）" enterkeyhint="search">
  <div id="tocList"></div>
</div></div>

<div class="sheet" id="fbSheet"><div class="shade"></div><div class="pane">
  <div class="grab"></div>
  <div class="hd"><span id="fbTitle">回饋</span><button class="btn ghost" data-close>取消</button></div>
  <div class="meta" id="fbWhere"></div>
  <div class="q" id="fbQuote" hidden></div>
  <div class="chips" id="fbType">
    <button class="on" data-v="問題">❓ 問題</button>
    <button data-v="修正">✏️ 修正</button>
    <button data-v="補充">➕ 補充</button>
    <button data-v="想深入">🔍 想深入</button>
  </div>
  <textarea id="fbText" placeholder="想問、想改、想補的內容。語音輸入也可以。"></textarea>
  <p class="hint">按「送出」會開啟 GitHub 新增 Issue 頁面（內容已幫你填好），在那裡按 Submit 就完成。需登入 GitHub；repo 是公開的，回饋也會公開。草稿會暫存在這台裝置。</p>
  <div class="row2"><button class="btn" data-close>取消</button><button class="btn pri" id="fbSend">送出到 GitHub</button></div>
</div></div>

<div class="sheet" id="listSheet"><div class="shade"></div><div class="pane">
  <div class="grab"></div>
  <div class="hd"><span>回饋與重點</span><button class="btn ghost" data-close>關閉</button></div>
  <div class="tabs"><button class="on" data-tab="fb">回饋</button><button data-tab="hl">我的重點</button></div>
  <div id="tabFb"><p class="meta" id="fbStatus">讀取中…</p><ul class="fbl" id="fbList"></ul>
    <div class="row2"><button class="btn" id="fbGeneral">💬 整體回饋</button><a class="btn" id="editLink" target="_blank" rel="noopener">✏️ 在 GitHub 直接編輯</a></div></div>
  <div id="tabHl" hidden><p class="hint">畫重點只存在這台裝置的瀏覽器裡，不會上傳。</p><ul class="fbl" id="hlList"></ul></div>
</div></div>

<div id="lb"><img alt=""></div>
<div id="toast"></div>

<script>
const REPO='evantilu/world-economy-study', PREFIX='[東京]', MD='report.md', MD_PATH='tokyo-case-study/report.md';
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',1800);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- theme & font (applied early) ---------- */
(function(){const r=document.documentElement;const t=store.get('tk-theme',null);if(t)r.dataset.theme=t;
  const f=store.get('tk-font',0);r.style.setProperty('--fs',[null,'18.5px','15.5px'][f]||'');})();

/* ---------- charts ---------- */
const Chart=(function(){
  const SER=['--s1','--s2','--s3','--s4'];
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt=(v,d)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:d==null?2:d});
  function nice(min,max,n){if(min===max){min-=1;max+=1}const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),r=step0/mag;
    const step=(r<1.5?1:r<3?2:r<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(10));return t;}
  async function load(spec){
    if(spec.csv){const txt=await (await fetch(spec.csv,{cache:'no-cache'})).text();
      const rows=txt.trim().split(/\r?\n/).filter(l=>l&&!l.startsWith('#')).map(l=>l.split(','));const h=rows.shift().map(s=>s.trim());
      const xi=h.indexOf(spec.xcol||h[0]);spec.x=rows.map(r=>isNaN(+r[xi])?r[xi]:+r[xi]);
      spec.series=(spec.ycols||h.filter((_,i)=>i!==xi)).map((c,k)=>{const i=h.indexOf(c);return{name:(spec.names&&spec.names[k])||c,data:rows.map(r=>r[i]===''||r[i]==null?null:+r[i])};});}
    return spec;}
  function render(fig,spec){
    const box=fig.querySelector('.ch-box');box.innerHTML='';
    const W=Math.max(280,box.clientWidth),narrow=W<480,H=spec.height||(narrow?230:290);
    const n=spec.x.length,ser=spec.series,multi=ser.length>1,endLab=multi&&ser.length<=4&&!narrow&&spec.type==='line';
    const vals=ser.flatMap(s=>s.data).filter(v=>v!=null&&!isNaN(v));
    let lo=Math.min(...vals),hi=Math.max(...vals);if(spec.type==='bar'||spec.zero!==false&&lo>0&&spec.yMin==null&&spec.type!=='line'){lo=Math.min(0,lo)}

/* ---------- text wrap helper (find quote across text nodes within nodes) ---------- */
function wrapText(roots,quote,cls,cb){
  const q=quote.replace(/\s+/g,' ').trim();if(q.length<2)return false;
  for(const root of roots){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let full='';
    while(w.nextNode()){const t=w.currentNode;if(t.parentElement.closest('svg,.ch-tip,script'))continue;nodes.push({t,start:full.length});full+=t.nodeValue;}
    const norm=full.replace(/\s/g,' ');const at=norm.indexOf(q);if(at<0)continue;const end=at+q.length;
    nodes.forEach(({t,start})=>{const s=Math.max(at,start),e=Math.min(end,start+t.nodeValue.length);if(s>=e)return;
      let node=t;if(e-start<node.nodeValue.length)node.splitText(e-start);if(s-start>0)node=node.splitText(s-start);
      const mk=document.createElement('mark');mk.className=cls;node.replaceWith(mk);mk.appendChild(node);if(cb)cb(mk);});
    return true;}
  return false;}

  const h1=main.querySelector('h1');if(h1)document.title=h1.textContent;

  // overview cards: replace <div id="map"></div>
  const mapEl=main.querySelector('#map');
  if(mapEl){mapEl.className='map';SECTIONS.filter(s=>s.level===2&&s.num).forEach(s=>{const a=document.createElement('a');a.href='#'+s.id;
    const title=s.title.replace(/^\d+\.?\s*/,'');const next=s.range().find(e=>e.tagName==='P'||e.classList.contains('co'));
    a.innerHTML=`<div class="n">第 ${esc(s.num)} 部分</div><div class="h"></div><div class="row">${s.status?`<span class="st ${STATUS[s.status]}">${esc(s.status)}</span>`:''}<span class="c"></span></div>`;
    a.querySelector('.h').textContent=title;mapEl.appendChild(a);s.card=a;});}

  // TOC
  const list=$('#tocList');
  SECTIONS.forEach(s=>{const a=document.createElement('a');a.href='#'+s.id;a.className='l'+s.level;
    const sp=document.createElement('span');sp.className='sp';sp.textContent=s.title;a.appendChild(sp);
    if(s.status&&s.level===2){const b=document.createElement('span');b.className='st '+STATUS[s.status];b.style.marginTop=0;b.textContent=s.status;a.appendChild(b);}
    a.onclick=()=>Sheets.closeAll();list.appendChild(a);s.toc=a;});

  // search
  const q=$('#q');q.addEventListener('change',()=>{$$('mark.sq').forEach(m=>m.replaceWith(...m.childNodes));main.normalize();const term=q.value.trim();if(!term)return;
    const w=document.createTreeWalker(main,NodeFilter.SHOW_TEXT);const hits=[];while(w.nextNode()){const t=w.currentNode;if(t.nodeValue.includes(term)&&!t.parentElement.closest('svg'))hits.push(t);}
    const marks=[];hits.forEach(n=>{const parts=n.nodeValue.split(term);const fr=document.createDocumentFragment();parts.forEach((p,i)=>{fr.append(p);if(i<parts.length-1){const m=document.createElement('mark');m.className='sq';m.textContent=term;fr.append(m);marks.push(m);}});n.replaceWith(fr);});
    if(marks.length){Sheets.closeAll();const d=marks[0].closest('details');if(d)d.open=true;marks[0].scrollIntoView({block:'center'});toast(`找到 ${marks.length} 處`);}else toast('找不到：'+term);});

  // selection bar
  const sb=$('#selbar');let selCtx=null;
  document.addEventListener('selectionchange',()=>{const s=getSelection();const t=s&&s.toString().trim();
    if(t&&t.length>1&&s.rangeCount&&main.contains(s.getRangeAt(0).commonAncestorContainer)){selCtx={quote:t.replace(/\s+/g,' ').slice(0,400),sec:secOf(s.getRangeAt(0).startContainer.parentElement)};sb.style.display='flex';}
    else{setTimeout(()=>{const s2=getSelection();if(!s2||!s2.toString().trim())sb.style.display='none';},150);}});
  sb.addEventListener('pointerdown',e=>e.preventDefault());
  $('#selFb').onclick=()=>{if(!selCtx)return;sb.style.display='none';const c=selCtx;getSelection().removeAllRanges();Feedback.open(c);};
  $('#selHl').onclick=()=>{if(!selCtx)return;sb.style.display='none';getSelection().removeAllRanges();HL.add(selCtx.quote,selCtx.sec);toast('已畫重點');};
  $('#selX').onclick=()=>{getSelection().removeAllRanges();sb.style.display='none';};
  main.addEventListener('click',e=>{const m=e.target.closest('mark.hl');if(m&&confirm('刪除這個重點？'))HL.remove(m.dataset.q);});

  // dock
  $('#dToc').onclick=()=>Sheets.open($('#tocSheet'));
  $('#dFb').onclick=()=>{Sheets.open($('#listSheet'));};
  $('#fbGeneral').onclick=()=>Feedback.open({sec:null});
  $('#editLink').href=`https://github.com/${REPO}/edit/main/${MD_PATH}`;
  $$('#listSheet .tabs button').forEach(b=>b.onclick=()=>{$$('#listSheet .tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#tabFb').hidden=b.dataset.tab!=='fb';$('#tabHl').hidden=b.dataset.tab!=='hl';});
  $('#dFont').onclick=()=>{const f=(store.get('tk-font',0)+1)%3;store.set('tk-font',f);document.documentElement.style.setProperty('--fs',[null,'18.5px','15.5px'][f]||'');$$('figure.chart').forEach(x=>x._rerender&&x._rerender());toast(['標準字級','大字級','小字級'][f]);};
  $('#dTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('tk-theme',r.dataset.theme);$$('figure.chart').forEach(x=>x._rerender&&x._rerender());};
  $('#dTop').onclick=()=>scrollTo({top:0,behavior:'smooth'});

  // lightbox
  const lb=$('#lb'),lbi=lb.querySelector('img');main.addEventListener('click',e=>{if(e.target.tagName==='IMG'){lbi.src=e.target.src;lb.classList.add('open');}});lb.onclick=()=>lb.classList.remove('open');

  // progress + current section in header
  const prog=$('#progress'),bt=$('#barTitle'),base=document.title;
  const onScroll=()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%';
    let cur=null;for(const s of SECTIONS){if(s.el.getBoundingClientRect().top<80)cur=s;else break;}
    const h2=cur?(cur.level===2?cur:[...SECTIONS].reverse().find(s=>s.level===2&&s.el.compareDocumentPosition(cur.el)&Node.DOCUMENT_POSITION_FOLLOWING)||cur):null;
    bt.innerHTML=h2?esc(h2.title)+(cur!==h2?'<small>'+esc(cur.title)+'</small>':''):esc(base);
    SECTIONS.forEach(s=>s.toc&&s.toc.classList.toggle('active',s===cur));};
  addEventListener('scroll',onScroll,{passive:true});onScroll();

  HL.apply(HL.list());HL.paint();
  if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
  Feedback.loadIssues();
})();
</script>
</body>
</html>
